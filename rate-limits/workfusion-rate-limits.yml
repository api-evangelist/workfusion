  kind: client-side pacing recommendation
  description: >-
    The provider recommends polling GET /api/v2/workfusion/task/{uuid}/steps "every 3-5
    minutes based on the expected execution duration" — the closest thing published to a
    call-rate expectation.
  url: https://doc.workfusion.com/platform/docs/api/workfusion-rest-api
