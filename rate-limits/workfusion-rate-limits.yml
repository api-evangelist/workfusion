note: >-
  No API rate limit is published on any WorkFusion endpoint, and no rate-limit response
  header (X-RateLimit-*, RateLimit-*, Retry-After) appears anywhere in the documentation.
  This is consistent with the deployment model — the API is served from the customer's
  own Control Tower instance, so throughput is bounded by that customer's cluster rather
  than by a vendor quota. An honest zero, not a gap in the search.
adjacent_mechanisms:
- name: Rate Limiter (no-code Business Process step)
  kind: design-time workflow throttle, NOT an API rate limit
  description: >-
    A bot step that caps the number of records passing through it within a configured
    time interval (default 100 records), used to stop two AI Agents in one environment
    from competing for BEP Workers. It throttles work inside a process; an API caller
    receives no signal from it.
  url: https://doc.workfusion.com/platform/docs/orchestrate/set-up-bp/rate-limiter
