domain_standards:
  assessed: true
  market: financial crime compliance / AML for banking
  regime: financial-services
  findings:
  - id: bsa-ofac
    declared_in_contract: false
    evidence: >-
      WorkFusion's marketing and solution pages reference BSA/OFAC obligations, and its
      AI Agents are built around sanctions, PEP, adverse-media and transaction-monitoring
      alert review. This is a regulatory context the product serves, not a message format
      or schema the API declares.
  - id: iso-20022
    declared_in_contract: false
    evidence: >-
      No ISO 20022 message type, pain/pacs/camt element, or payment-message schema
      appears in any published endpoint, payload example or field list. Payment sanctions
      screening (Tara) consumes the customer's own payment messages inside a Business
      Process; the API surface transports CSV/XLSX and opaque Data Store rows.
  - id: fapi
    declared_in_contract: false
    evidence: no FAPI security profile is claimed; the API is session/CSRF based
  conclusion: >-
    No domain standard is declared by a WorkFusion contract. This is a reward-only
    dimension and the absence is recorded, not scored against the provider: WorkFusion
    sells an alert-review workforce that runs inside a bank's existing screening stack,
    and its published integration surface is deliberately format-agnostic (Excel/CSV over
    S3, HTTP or FTP; Data Store rows; opaque Business Process payloads).
third_party_screening_sources:
