- version: 10.3.2.5
  date: '2026-08-28'
  url: https://doc.workfusion.com/platform/releases/iac-10-3-2-5-release-notes
  breaking: false
  highlights:
  - Security and stability release; third-party components updated
  - NGINX 1.30.4, Apache Tomcat 10.1.57, RabbitMQ 4.3.4, Handlebars.js 4.7.9, ELK for RPA 9.4.4, OpenBao 2.4.4.6-wf-build
  - Fixed sign-in/session initialization on Windows 11 Unified deployments
  - Fixed RPA Vault connectivity and Edge Portable WebDriver retrieval
  - Fixed queue cleanup for signal-based Business Processes
  - Workspace performance under heavy load improved
