aid: workfusion
name: WorkFusion
description: 'WorkFusion, Inc. is a New York headquartered enterprise AI company whose
  Work.AI platform (formerly WorkFusion Intelligent Automation Cloud) ships pre-built
  AI Agents — Evelyn, Evan, Tara, Edward, Isaac and Kayla — that review financial-crime
  compliance alerts for banks and financial institutions: name and PEP sanctions screening,
  payment sanctions screening, adverse media monitoring, enhanced due diligence, AML
  transaction monitoring and KYC onboarding. The platform is delivered as customer-tenant
  cloud services or self-hosted software, and its REST API family — Business Process
  orchestration, Data Stores, Secrets Vault, Packages, Asset Bundle migration, Workspace,
  OCR and Rules — is documented publicly at doc.workfusion.com but is served only from
  a customer''s own Control Tower instance. No OpenAPI is published: the platform''s
  Springfox Swagger UI is disabled by default and requires a login to the customer
  instance.'
image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
url: https://raw.githubusercontent.com/api-evangelist/workfusion/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-09-04'
modified: '2026-09-04'
