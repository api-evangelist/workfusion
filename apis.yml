apis:
- aid: workfusion:workfusion-rest-api
  name: WorkFusion REST API
  description: 'Launches, feeds and reads results from Business Processes (BPs) and
    Manual Tasks on the Work.AI platform. Covers the BP lifecycle (draft, processing,
    paused, completed) with create/start/pause/stop actions, BP instance detail and
    snapshot retrieval, and CSV/XLSX result export. Authenticated by form login against
    Control Tower (JSESSIONID cookie plus X-CSRF-TOKEN header). Served only from a
    customer''s own Control Tower host.'
  humanURL: https://doc.workfusion.com/platform/docs/api/workfusion-rest-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{hostname}/workfusion/api
  tags:
  - Business Process
  - Orchestration
  - Task
  tags_raw:
  - Business Process
  - Orchestration
  - Tasks
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/workfusion-rest-api
  - type: Authentication
    url: authentication/workfusion-authentication.yml
- aid: workfusion:data-store-rest-api
  name: Data Store REST API
  description: Remote management of Work.AI Data Stores over JSON. Exposes SQL select
    and execute against ds_-prefixed stores, plus createOrUpdate, insert and delete
    on a named Data Store.
  humanURL: https://doc.workfusion.com/platform/docs/api/data-store-rest-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{hostname}/workfusion/api/v1/datastores
  tags:
  - Datastore
  - SQL
  tags_raw:
  - Data Store
  - SQL
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/data-store-rest-api
- aid: workfusion:secrets-vault-api
  name: Secrets Vault API
  description: Credential management for automations. Retrieves, saves, updates and
    deletes secure entries by alias; passwords are supplied Bcrypt-encoded at strength
    10. Responses use the platform's responseStatus/body/errors envelope.
  humanURL: https://doc.workfusion.com/platform/docs/api/secrets-vault-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{hostname}/workfusion/api/v1/secrets-vault
  tags:
  - Secrets
  - Credentials
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/secrets-vault-api
- aid: workfusion:data-management-api
  name: Data Management API
  description: Manages database and S3 data purging plus data archival and restoration
    configurations, including cron-scheduled runs and execution history. Paged and
    sorted with page, size, sort and sortDirection query parameters.
  humanURL: https://doc.workfusion.com/platform/docs/api/data-purge-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{control-tower-host}/api/v1
  tags:
  - Data Management
  - Retention
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/data-purge-api
- aid: workfusion:packages-api
  name: Packages API
  description: Migrates Business Processes across Control Tower instances by packaging
    runs and Data Stores, with CREATE_WITH_NEW_NAME, REPLACE_EXISTING and SKIP_IMPORT
    conflict resolution. Uses HTTP Basic authentication.
  humanURL: https://doc.workfusion.com/platform/docs/api/packages-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{hostname}/mturk-web/soap/api
  tags:
  - Migration
  - Packages
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/packages-api
- aid: workfusion:asset-bundle-migration-api
  name: AI Agent Asset Bundle Migration API
  description: Imports and exports AI Agent Asset Bundles and Variation Asset Bundles
    between Control Tower instances, with REPLACE and SKIP_DATASTORES conflict strategies,
    md5 checksum validation and asynchronous import status (ACCEPTED, UPLOAD_FAILED,
    VALIDATION_FAILED, FAILED).
  humanURL: https://doc.workfusion.com/platform/docs/api/asset-bundle-migration-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{hostname}/workfusion/api/v1
  tags:
  - Migration
  - Asset Bundle
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/asset-bundle-migration-api
- aid: workfusion:workspace-shared-api
  name: Workspace Shared API
  description: Access to shared Workspace resources — assignments, draft and submitted
    answers, users, user groups and Workspace metadata. Assignment states are READY_TO_PROCESS,
    IN_PROGRESS, COMPLETED, EXPIRED, INACTIVE and DELETED.
  humanURL: https://doc.workfusion.com/platform/docs/api/workspace-shared-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: https://{workspace-host}/workspace/api/v1
  tags:
  - Workspace
  - Human-in-the-Loop
  tags_raw:
  - Workspace
  - Human In The Loop
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/workspace-shared-api
- aid: workfusion:ocr-rest-api
  name: OCR REST API
  description: Document recognition service used by Intelligent Document Processing.
    submitImage/processImage accept a file and OCR parameters, getTaskStatus polls
    by task id, and download returns the converted result. Responses are XML. The
    GET processDocument form is deprecated in favour of POST.
  humanURL: https://doc.workfusion.com/platform/docs/api/ocr-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: http://{ocr-host}:8080/api/v2/cloud
  tags:
  - OCR
  - Document Processing
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/ocr-api
- aid: workfusion:rules-api
  name: Rule Builder and GenAI Rules REST API
  description: Decisioning services the customer runs alongside the platform. POST
    /decisionRules evaluates a data object against a decision-rules configuration and
    returns the rules fired plus the decision; POST /generateRulesWithSchema turns a
    natural-language prompt into a decision-rule JSON using a configured OpenAI key.
    Both ship their own Swagger UI on the local port.
  humanURL: https://doc.workfusion.com/platform/docs/api/rule-builder-rest-api
  image: https://www.workfusion.com/wp-content/uploads/2023/01/favicon.png
  baseURL: http://{rules-host}:5000
  tags:
  - Rules
  - Decisioning
  - GenAI
  properties:
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/rule-builder-rest-api
  - type: Documentation
    url: https://doc.workfusion.com/platform/docs/api/genai-rest-api
