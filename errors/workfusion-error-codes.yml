format: vendor-envelope
rfc9457: false
note: >-
  WorkFusion publishes no OpenAPI, so this catalog is NOT derived from 4xx/5xx responses
  in a spec — every entry below is read from a worked example or a documented status
  enumeration in the provider's own public documentation. The published surface is thin:
  there is no consolidated error reference page, and the only numeric error codes the
  docs ever show are the two Secrets Vault examples.
envelope:
  fields:
    responseStatus: SUCCESS or FAILURE
    body: the payload on success, null on failure
    errors: array of { code, message }
  example_failure: |
    {
      "responseStatus": "FAILURE",
      "body": null,
      "errors": [ { "code": 22, "message": "Invalid password" } ]
    }
  docs: https://doc.workfusion.com/platform/docs/api/secrets-vault-api
codes:
- code: 20
  message: Secure Entry <alias> already exists
  surface: Secrets Vault API
  meaning: conflict — an entry with that alias is already stored
  action: use entry/update instead of entry/put, or choose another alias
  source: https://doc.workfusion.com/platform/docs/api/secrets-vault-api
- code: 22
  message: Invalid password
  surface: Secrets Vault API
  meaning: the supplied credential did not authenticate the vault operation
  action: re-check the Bcrypt(10) encoded password value
  source: https://doc.workfusion.com/platform/docs/api/secrets-vault-api
