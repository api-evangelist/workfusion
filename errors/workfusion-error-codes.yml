- name: Business Process run status
  surface: WorkFusion REST API
  values:
  - value: COMPLETED
    meaning: the step finished; the BP is done when the final step reports COMPLETED
  - value: 'null'
    meaning: >-
      the provider documents a null runStatus as the failure signal — "the Business
      Process failed with an error, and additional investigation is needed". A null
      field, not a status code, is how a failed run is reported to an API caller.
  source: https://doc.workfusion.com/platform/docs/api/workfusion-rest-api
